[project]
name = "labpilot"
version = "0.1.0"
description = "A policy-governed MCP agent for reproducible ML experimentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saeed Al-maqtari" }]
keywords = ["mcp", "agent", "mlops", "experiment-tracking", "policy-as-code"]

dependencies = [
    "mcp",
    "langgraph",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "httpx",
    "structlog",
    "typer",
]

[project.urls]
Homepage = "https://github.com/saeedadeeb103/LabPilot"

[dependency-groups]
ml = [
    "mlflow",
    "hydra-core",
    "scikit-learn",
    "pandas",
    "numpy",
]
runtime = [
    "docker",
]
otel = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "hypothesis",
    "testcontainers[postgres]",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
    "aiosqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]

# ---------------------------------------------------------------------------
# Linting and formatting
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PL",   # pylint
    "TRY",  # tryceratops
    "RUF",  # ruff-specific
    "S",    # flake8-bandit
    "ASYNC",
    "D",    # pydocstyle
]
ignore = [
    "D100",  # module docstrings are required only where they add meaning
    "D104",
    "D107",  # __init__ documented on the class
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------------------
# Type checking
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src/labpilot", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
enable_error_code = [
    "redundant-expr",
    "truthy-bool",
    "ignore-without-code",
    "possibly-undefined",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated, no I/O",
    "property: Hypothesis-driven",
    "contract: MCP tool contract matrix",
    "integration: requires external services",
    "adversarial: security and abuse scenarios",
    "e2e: full workflow through the API",
]

[tool.coverage.run]
source = ["src/labpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
